version: '3.8'

services:
  yellorec:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: yellorec-server
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - RR_BUILD=20260323
      - LOG_LEVEL=INFO
      - DEBUG=False
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - yellorec-net

networks:
  yellorec-net:
    driver: bridge
