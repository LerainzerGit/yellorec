name: Build and Deploy RR Build 20260323

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Rec Room build number'
        required: false
        default: '20260323'

jobs:
  download-and-modify:
    runs-on: ubuntu-latest
    outputs:
      build_size: ${{ steps.check_size.outputs.size }}
      build_hash: ${{ steps.create_hash.outputs.hash }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests pyyaml
      
      - name: Download Rec Room build from archive
        run: |
          python build_downloader.py
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number || '20260323' }}
      
      - name: Modify server configuration
        run: |
          python scripts/patch_build.py
        env:
          YELLOREC_SERVER: "localhost:8080"
          BUILD_PATH: "./builds/20260323"
      
      - name: Create build package
        run: |
          cd builds/20260323
          zip -r RecRoom_20260323_Yellorec.zip . -x "*.zip"
          cd ../../
          mv builds/20260323/RecRoom_20260323_Yellorec.zip ./
      
      - name: Check file size
        id: check_size
        run: |
          SIZE=$(stat -f%z RecRoom_20260323_Yellorec.zip 2>/dev/null || stat -c%s RecRoom_20260323_Yellorec.zip 2>/dev/null)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "size=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "File size: ${SIZE_MB}MB"
          
          # GitHub release limit is 2GB
          if [ $SIZE_MB -gt 2048 ]; then
            echo "large_file=true" >> $GITHUB_OUTPUT
          else
            echo "large_file=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create hash
        id: create_hash
        run: |
          HASH=$(sha256sum RecRoom_20260323_Yellorec.zip | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "SHA256: $HASH"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecRoom_20260323_Yellorec
          path: RecRoom_20260323_Yellorec.zip
          retention-days: 30

  create-release:
    needs: download-and-modify
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: RecRoom_20260323_Yellorec
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v20260323-yellorec
          name: Rec Room Build 20260323 - Yellorec
          body: |
            # Rec Room Build 20260323 - Yellorec Server Edition
            
            This build has been modified to connect to the Yellorec custom server.
            
            ## Build Information
            - **Original Build**: 20260323
            - **Build Date**: ${{ github.event.repository.updated_at }}
            - **File Size**: ${{ needs.download-and-modify.outputs.build_size }}MB
            - **SHA256**: ${{ needs.download-and-modify.outputs.build_hash }}
            
            ## Server Configuration
            - **Server**: localhost:8080
            - **Protocol**: Yellorec v1.0
            
            ## Installation
            1. Extract the ZIP file
            2. Run the Yellorec server (`docker-compose -f docker/docker-compose.yml up`)
            3. Launch RecRoom.exe
            
            ## Features
            - Room hosting
            - Matchmaking
            - Chat and inventory
            - Player progression
            
            **Note**: This is a modified build for use with the Yellorec custom server.
          files: RecRoom_20260323_Yellorec.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-build:
    needs: download-and-modify
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: RecRoom_20260323_Yellorec
      
      - name: Verify build integrity
        run: |
          echo "Build Size: ${{ needs.download-and-modify.outputs.build_size }}MB"
          echo "Build Hash: ${{ needs.download-and-modify.outputs.build_hash }}"
          
          # List contents
          unzip -l RecRoom_20260323_Yellorec.zip | head -20
          
          echo "✓ Build verification complete"
      
      - name: Generate build report
        run: |
          cat > build_report.txt << EOF
          Yellorec Build Report
          ======================
          Build Number: 20260323
          Build Date: $(date)
          File Size: ${{ needs.download-and-modify.outputs.build_size }}MB
          SHA256: ${{ needs.download-and-modify.outputs.build_hash }}
          Status: SUCCESS
          
          This build has been modified to use the Yellorec custom server.
          All game servers have been redirected to localhost:8080
          EOF
          
          cat build_report.txt
      
      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build_report
          path: build_report.txt
